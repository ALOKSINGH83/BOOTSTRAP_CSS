<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTSTRAP CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Bootstrap Page</h1>
        <br>
        <div class="btn-group btn-group-divider" role="group" aria-label="Solid example">
            <button type="button" class="btn-solid theme-primary">Left</button>
            <button type="button" class="btn-solid theme-primary">Middle</button>
            <button type="button" class="btn-solid theme-primary">Right</button>
        </div>
        <button type="button" class="btn-solid theme-primary">Left</button>
        <button type="button" class="btn-solid theme-primary">Middle</button>
        <button type="button" class="btn-solid theme-primary">Right</button>
        <br><br>
        <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
            <label class="btn-check btn-outline theme-primary">
                <input type="checkbox" autocomplete="off">
                Check 1
            </label>
            <label class="btn-check btn-outline theme-primary">
                <input type="checkbox" autocomplete="off">
                Check 2
            </label>
            <label class="btn-check btn-outline theme-primary">
                <input type="checkbox" autocomplete="off">
                Check 3
            </label>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
