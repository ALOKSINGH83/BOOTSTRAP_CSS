<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTSTRAP CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Grid System</h2>
        <div class="row">
            <div class="lg:col-4 bg-success">Column 1</div>
            <div class="lg:col-4 bg-info">Column 2</div>
            <div class="lg:col-4 bg-warning">Column 3</div>
        </div>
        <br>
        <div class="row">
            <div class="sm:col-2 bg-danger">Column 1</div>
            <div class="sm:col-8 bg-primary">Column 2</div>
            <div class="sm:col-2 bg-secondary">Column 3</div>
        </div>
        <br>
        <div class="row">
            <div class="lg:col-3 md:col-3 bg-light">Column 1</div>
            <div class="col bg-dark text-white">Column 2</div>
            <div class="col bg-info">Column 3</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
