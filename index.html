<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTSTRAP CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Form Demo</h2>
        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="pass" class="form-label">Password</label>
                <input type="password" class="form-control" id="pass" placeholder="Enter your password">
            </div>
            <div class="mb-4 mt-3">
                <select class="form-select">
                    <option class="select" selected>Select your city</option>
                    <option class="1">Mumbai</option>
                    <option class="2">Prayagraj</option>
                    <option class="3">Varanasi</option>
                </select>
            </div>
            <div class="form-field mb-4">
                <input type="checkbox" id="checkinverse" class="check theme-inverse" checked />
                <label for="checkinverse">Example inverse checkbox</label>
            </div>
            <div class="form-field mb-4">
                <input class="radio theme-secondary" name="radios" type="radio" id="radioLabel" />
                <label for="radioLabel">First example radio</label>
            </div>
            <div class="form-field mb-4">
                <input class="radio theme-secondary" name="radios" type="radio" id="radioLabel2" />
                <label for="radioLabel2">Second example radio</label>
            </div>
            <div class="form-field mb-4">
            <div class="switch theme-warning">
                <input type="checkbox" value="" id="switchwarning" role="switch" switch checked>
            </div>
                <label for="switchwarning">Example warning switch</label>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
